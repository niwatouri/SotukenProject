version: "3"

services:
  # PostgreSQL データベース
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - zapnet

  # ログインAPI（例：Node.js / Express）
  login:
    build:
      context: ./login
      dockerfile: Dockerfile
    container_name: login
    restart: on-failure
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mydb
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - "3000:3000"
    volumes:
      - ./login:/app
      - login-node-modules:/app/node_modules
    networks:
      - zapnet

  # フロントエンド（React）
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80" # または 3000:80 に変更可能
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - zapnet

  # バックエンド（FastAPI）
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/reports
    depends_on:
      - zap-scanner
    environment:
      - ZAP_SCANNER_URL=http://zap-scanner:5000
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - zapnet

  # ワーカー（RQ）
  worker:
    build: ./backend
    container_name: rq-worker
    command: [ "python", "app/worker.py" ]
    depends_on:
      - backend
      - redis
    environment:
      - ZAP_SCANNER_URL=http://zap-scanner:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./reports:/reports
    networks:
      - zapnet

  # Redis
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - zapnet

  # ZAPスキャナー
  zap-scanner:
    build:
      context: ./zap-scanner
      dockerfile: Dockerfile
    container_name: zap-scanner
    environment:
      - ZAP_API_KEY=${ZAP_API_KEY}
    volumes:
      - ./reports:/reports
    ports:
      - "8090:8090"
      - "5000:5000"
    networks:
      - zapnet

volumes:
  postgres-data:
  login-node-modules:


networks:
  zapnet:
    driver: bridge
