version: "3"

services:
  # PostgreSQL データベース
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - zapnet

  # ログインAPI（例：Node.js / Express）
  login:
    build:
      context: ./login
      dockerfile: Dockerfile
    container_name: login
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: mydb
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - "3000:3000"
    volumes:
      - ./login:/app
      - login-node-modules:/app/node_modules
    networks:
      - zapnet

  # フロントエンド（React）
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80" # または 3000:80 に変更可能
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - zapnet

  # バックエンド（FastAPI）
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/reports
    depends_on:
      db:
        condition: service_healthy
      zap-scanner:
        condition: service_healthy
    environment:
      - ZAP_SCANNER_URL=http://zap-scanner:5000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ZAP_SCANNER_API_KEY=${ZAP_SCANNER_API_KEY}
      - SCAN_TIMEOUT_SECONDS=${SCAN_TIMEOUT_SECONDS}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    networks:
      - zapnet

  # ワーカー（RQ）
  worker:
    build: ./backend
    command: [ "python", "app/worker.py" ]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      redis:
        condition: service_started
      zap-scanner:
        condition: service_healthy
    environment:
      - ZAP_SCANNER_URL=http://zap-scanner:5000
      - ZAP_SCANNER_API_KEY=${ZAP_SCANNER_API_KEY}
      - SCAN_TIMEOUT_SECONDS=${SCAN_TIMEOUT_SECONDS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./reports:/reports
    networks:
      - zapnet

  # Redis
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - zapnet

  # ZAPスキャナー
  zap-scanner:
    build:
      context: ./zap-scanner
      dockerfile: Dockerfile
    environment:
      - ZAP_API_KEY=${ZAP_API_KEY}
      - ZAP_SCANNER_API_KEY=${ZAP_SCANNER_API_KEY}
      - BACKEND_URL=http://backend:8000
      - SPIDER_MAX_DURATION_MINUTES=${SPIDER_MAX_DURATION_MINUTES}
      - SPIDER_MAX_DEPTH=${SPIDER_MAX_DEPTH}
      - SPIDER_MAX_CHILDREN=${SPIDER_MAX_CHILDREN}
      - SPIDER_THREAD_COUNT=${SPIDER_THREAD_COUNT}
      - ASCAN_MAX_DURATION_MINUTES=${ASCAN_MAX_DURATION_MINUTES}
      - ASCAN_MAX_RULE_DURATION_MINUTES=${ASCAN_MAX_RULE_DURATION_MINUTES}
      - ASCAN_MAX_RESULTS=${ASCAN_MAX_RESULTS}
      - ASCAN_THREADS_PER_HOST=${ASCAN_THREADS_PER_HOST}
      - ASCAN_DELAY_IN_MS=${ASCAN_DELAY_IN_MS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health >/dev/null || exit 1"]
      interval: 90s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./reports:/reports
    networks:
      - zapnet

  # AI解析
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: zap-ai
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - REPORT_PATHS=/reports/zap_report_*.json,/reports/zap_report_*.xml,/reports/zap_report_*.html
      - WAIT_TIMEOUT=${WAIT_TIMEOUT:-300}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - AI_JSON_PATH=/reports/ai_advice.json
      - AI_TXT_PATH=/reports/ai_advice.txt
    volumes:
      - ./reports:/reports
    depends_on:
      zap-scanner:
        condition: service_healthy
    networks:
      - zapnet

volumes:
  postgres-data:
  login-node-modules:


networks:
  zapnet:
    driver: bridge
